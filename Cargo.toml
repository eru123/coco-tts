[package]
name = "coco-tts"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
ort = "2.0.0-rc.13" # ONNX Runtime Rust bindings (1.x is fully yanked on crates.io)
rodio = "0.17"   # Cross-platform audio playback (CPAL / ALSA / CoreAudio / WASAPI)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hound = "3.5"    # WAV encoder/decoder
anyhow = "1.0"
dirs = "5.0"     # Platform data directory resolution (~/.local/share, %APPDATA%, ...)
ureq = "2"       # Voice model downloads from the piper-voices collection
